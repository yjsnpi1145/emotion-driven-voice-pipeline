schema_version: 1
modules:
  - module_id: indextts2_inference
    need: 由中文参考文本与 8 维情绪向量生成参考 WAV
    disposition: reuse
    candidates:
      - repository: https://github.com/index-tts/index-tts
        spdx_license: MIT
        pin: 90ca4d608209584bad3a5bd5becc0b80c146e60f
    selected: https://github.com/index-tts/index-tts
    decision_reason: 官方推理实现，维护活跃；固定 commit 依赖并在独立 worker 环境中调用
    wrapper_boundary: 本项目的薄 Index HTTP worker 仅做参数校验、路径限制、指纹校验与进程封装；不复制 infer_v2 源码
    lock_reference: config/engines.lock.yaml (indextts.revision)

  - module_id: gpt_sovits_api_v2
    need: 由绑定参考音频与目标文本生成日语/英语目标语音
    disposition: reuse
    candidates:
      - repository: https://github.com/RVC-Boss/GPT-SoVITS
        spdx_license: MIT
        pin: d523079fc05d9a8028d6085bffe4a2757c32abb6
    selected: https://github.com/RVC-Boss/GPT-SoVITS
    decision_reason: 官方 api_v2.py 提供 /tts HTTP 接口；直接固定 commit 使用，不 fork 不修改
    wrapper_boundary: 控制面只通过 HTTP adapter 调用官方 api_v2.py；adapter 负责绑定 prompt_text 与参考音频校验
    lock_reference: config/engines.lock.yaml (gpt_sovits.revision)

  - module_id: fastapi
    need: 控制面与 Index worker 的 HTTP 服务框架
    disposition: reuse
    candidates:
      - repository: https://github.com/fastapi/fastapi
        spdx_license: MIT
        pin: ">=0.115.2,<1"
    selected: https://github.com/fastapi/fastapi
    decision_reason: 成熟、维护活跃的异步 Web 框架；作为依赖直接使用
    wrapper_boundary: 无包装，直接作为依赖使用
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: uvicorn
    need: ASGI 服务器，单 worker 运行控制面
    disposition: reuse
    candidates:
      - repository: https://github.com/encode/uvicorn
        spdx_license: BSD-3-Clause
        pin: ">=0.34,<1"
    selected: https://github.com/encode/uvicorn
    decision_reason: FastAPI 官方推荐的 ASGI 服务器；固定 workers=1
    wrapper_boundary: 无包装；CLI 显式构造 uvicorn.Config/Server
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: httpx
    need: 控制面 HTTP adapter 与 CLI 客户端
    disposition: reuse
    candidates:
      - repository: https://github.com/encode/httpx
        spdx_license: BSD-3-Clause
        pin: ">=0.28,<1"
    selected: https://github.com/encode/httpx
    decision_reason: 成熟异步 HTTP 客户端；支持 timeout/stream 精确控制
    wrapper_boundary: adapter 薄封装，仅做错误映射与产物发布
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: pydantic
    need: 强类型请求/响应 schema 与配置校验
    disposition: reuse
    candidates:
      - repository: https://github.com/pydantic/pydantic
        spdx_license: MIT
        pin: ">=2.10,<3"
    selected: https://github.com/pydantic/pydantic
    decision_reason: 维护活跃的校验库；v2 模型用于全部公共契约
    wrapper_boundary: 无包装，直接作为依赖使用
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: typer
    need: CLI 命令框架
    disposition: reuse
    candidates:
      - repository: https://github.com/fastapi/typer
        spdx_license: MIT
        pin: ">=0.15,<1"
    selected: https://github.com/fastapi/typer
    decision_reason: 成熟 CLI 框架，与 FastAPI 同生态
    wrapper_boundary: 无包装，直接作为依赖使用
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: psutil
    need: Windows 进程树管理与健康探测
    disposition: reuse
    candidates:
      - repository: https://github.com/giampaolo/psutil
        spdx_license: BSD-3-Clause
        pin: ">=6.1,<8"
    selected: https://github.com/giampaolo/psutil
    decision_reason: 标准进程/网络查询库；用于递归处理 children 与端口 owner 校验
    wrapper_boundary: 在 ManagedProcess/Supervisor 内薄封装
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: soundfile
    need: 独立 WAV 解码与门禁探测
    disposition: reuse
    candidates:
      - repository: https://github.com/bastibe/python-soundfile
        spdx_license: BSD-3-Clause
        pin: ">=0.13,<1"
    selected: https://github.com/bastibe/python-soundfile
    decision_reason: libsndfile 绑定，维护活跃；独立读取真实文件计算指标
    wrapper_boundary: wav_probe 模块内薄封装
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: huggingface_hub
    need: 固定 revision 下载模型与预训练资产
    disposition: reuse
    candidates:
      - repository: https://github.com/huggingface/huggingface_hub
        spdx_license: Apache-2.0
        pin: cli+hf_xet (uv tool run)
    selected: https://github.com/huggingface/huggingface_hub
    decision_reason: 官方下载客户端；按固定 revision 下载，禁用 main 自动下载
    wrapper_boundary: 仅出现在 setup 脚本命令行
    lock_reference: scripts/setup-indextts.ps1 / setup-gpt-sovits.ps1

  - module_id: uv
    need: Python 环境与依赖锁定管理
    disposition: reuse
    candidates:
      - repository: https://github.com/astral-sh/uv
        spdx_license: MIT OR Apache-2.0
        pin: 0.11.24
    selected: https://github.com/astral-sh/uv
    decision_reason: 官方维护的 Python 包管理器；用于三环境隔离与 hash 锁
    wrapper_boundary: 仅出现在 setup 脚本命令行
    lock_reference: scripts/setup-*.ps1

  - module_id: numpy
    need: 数值计算与 RMS/peak 指标
    disposition: reuse
    candidates:
      - repository: https://github.com/numpy/numpy
        spdx_license: BSD-3-Clause
        pin: ">=2.1,<3"
    selected: https://github.com/numpy/numpy
    decision_reason: 标准数值库，维护活跃
    wrapper_boundary: 无包装，直接作为依赖使用
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: pytest_ecosystem
    need: 测试框架（pytest/pytest-asyncio/pytest-cov/respx/ruff/mypy）
    disposition: reuse
    candidates:
      - repository: https://github.com/pytest-dev/pytest
        spdx_license: MIT
        pin: ">=8.3,<9"
    selected: https://github.com/pytest-dev/pytest
    decision_reason: 标准测试栈，dev 依赖直接使用
    wrapper_boundary: 无包装
    lock_reference: pyproject.toml [project.optional-dependencies].dev

  - module_id: indextts_http_worker
    need: 控制面与 IndexTTS2 之间的独立 loopback 进程与安全边界
    disposition: thin_wrapper
    candidates:
      - repository: https://github.com/index-tts/index-tts
        spdx_license: MIT
        pin: 90ca4d608209584bad3a5bd5becc0b80c146e60f
    selected: https://github.com/index-tts/index-tts (上游推理) + 本项目薄 worker
    decision_reason: 项目安全边界需要独立进程、路径限制、指纹握手与原子发布；内部仍调用官方 IndexTTS2.infer
    wrapper_boundary: workers/indextts2/* 仅做 HTTP 外壳、参数校验与进程封装；推理逻辑全部委托上游
    lock_reference: config/engines.lock.yaml

  - module_id: http_adapters
    need: 控制面到两个引擎的 HTTP 适配层
    disposition: thin_wrapper
    candidates:
      - repository: https://github.com/encode/httpx
        spdx_license: BSD-3-Clause
        pin: ">=0.28,<1"
    selected: https://github.com/encode/httpx (底层) + 本项目薄 adapter
    decision_reason: 适配层负责请求契约映射、错误分类与原子发布；不重写 HTTP 能力
    wrapper_boundary: src/voice_pipeline/modules/{indextts,gpt_sovits}/client.py
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: atomic_output
    need: 不可变产物的 O_EXCL 保留与原子发布
    disposition: custom
    candidates: []
    selected: null
    decision_reason: Windows 上 os.O_CREAT|O_EXCL 保留 + os.replace 原子发布的语义是项目安全边界，无现成维护活跃组件
    wrapper_boundary: src/voice_pipeline/modules/audio/atomic_output.py
    lock_reference: null
    rejected_reasons:
      - 未发现同时提供 O_EXCL 保留、ownership 跟踪与 rollback 语义的维护活跃开源库

  - module_id: wav_gates
    need: 独立 WAV 解码门禁（时长/静音/单声道/有限数值）
    disposition: custom
    candidates: []
    selected: null
    decision_reason: 基于 soundfile+numpy 的几行判定逻辑，直接复用底层库，无整库可复用
    wrapper_boundary: src/voice_pipeline/modules/audio/wav_probe.py
    lock_reference: null
    rejected_reasons:
      - 使用 VAD/ASR 等重组件超出批次 1 范围；librosa 等库不提供本项目所需固定阈值语义

  - module_id: gpu_queue
    need: 单消费者 GPU 串行队列
    disposition: custom
    candidates: []
    selected: null
    decision_reason: 单进程 asyncio 队列 + 恰好一个 consumer 的语义简单且无需引入分布式组件
    wrapper_boundary: src/voice_pipeline/core/gpu_queue.py
    lock_reference: null
    rejected_reasons:
      - 引入 SQLite/Redis/Celery 属于批次 1 明确非目标

  - module_id: process_supervisor
    need: Windows 受管进程生命周期与 PID registry
    disposition: custom
    candidates: []
    selected: null
    decision_reason: 双引擎生命周期（resident/exclusive）、deadline 共享、进程树终止与原子 PID registry 是项目安全边界
    wrapper_boundary: src/voice_pipeline/runtime/supervisor.py + process.py
    lock_reference: null
    rejected_reasons:
      - supervisor 类库（如 supervisor/superlance）面向 POSIX 且生命周期语义不符
      - psutil 已作为底层复用，进程编排逻辑需按项目 deadline 约束自研

  - module_id: sqlalchemy
    introduced_in_batch: 2
    need: SQLite durable job, version and artifact persistence
    disposition: reuse
    candidates:
      - repository: https://github.com/sqlalchemy/sqlalchemy
        spdx_license: MIT
        pin: 2.0.51
    selected: SQLAlchemy async ORM
    decision_reason: Reuses a maintained ORM and transaction implementation instead of custom SQL mapping.
    wrapper_boundary: src/voice_pipeline/storage only owns project-specific tables and transactions.
    lock_reference: uv.lock (sqlalchemy==2.0.51)

  - module_id: alembic
    introduced_in_batch: 2
    need: Versioned SQLite schema migrations
    disposition: reuse
    candidates:
      - repository: https://github.com/sqlalchemy/alembic
        spdx_license: MIT
        pin: 1.19.0
    selected: Alembic
    decision_reason: Reuses maintained migration execution and revision tracking.
    wrapper_boundary: src/voice_pipeline/storage/migrations defines only project schema revisions.
    lock_reference: uv.lock (alembic==1.19.0)

  - module_id: aiosqlite
    introduced_in_batch: 2
    need: Async SQLite DB-API transport
    disposition: reuse
    candidates:
      - repository: https://github.com/omnilib/aiosqlite
        spdx_license: MIT
        pin: 0.22.1
    selected: aiosqlite
    decision_reason: Reuses maintained async SQLite connection adaptation.
    wrapper_boundary: SQLAlchemy async engine configuration only.
    lock_reference: uv.lock (aiosqlite==0.22.1)

  - module_id: portalocker
    introduced_in_batch: 2
    need: Cross-process local control-plane single-instance lock
    disposition: reuse
    candidates:
      - repository: https://github.com/wolph/portalocker
        spdx_license: BSD-3-Clause
        pin: 4.1.0
    selected: portalocker
    decision_reason: Reuses maintained Windows file-lock semantics instead of custom locking.
    wrapper_boundary: storage database bootstrap lock only.
    lock_reference: uv.lock (portalocker==4.1.0)

  - module_id: faster_whisper
    introduced_in_batch: 2
    need: Local ASR quality gate for generated audio
    disposition: reuse
    candidates:
      - repository: https://github.com/SYSTRAN/faster-whisper
        spdx_license: MIT
        pin: 1.2.1
    selected: faster-whisper
    decision_reason: Reuses maintained CTranslate2-backed Whisper inference.
    wrapper_boundary: quality adapter normalizes transcription output to the project quality contract.
    lock_reference: uv.lock (faster-whisper==1.2.1) + config/quality-model.lock.yaml

  - module_id: silero_vad
    introduced_in_batch: 2
    need: Local speech/silence VAD quality gate
    disposition: reuse
    candidates:
      - repository: https://github.com/snakers4/silero-vad
        spdx_license: MIT
        pin: 6.2.1
    selected: silero-vad
    decision_reason: Reuses upstream VAD model rather than implementing speech detection.
    wrapper_boundary: quality adapter invokes the pinned model and returns project quality metrics.
    lock_reference: uv.lock (silero-vad==6.2.1) + config/quality-model.lock.yaml

  - module_id: rapidfuzz
    introduced_in_batch: 2
    need: Deterministic ASR/text alignment similarity scoring
    disposition: reuse
    candidates:
      - repository: https://github.com/rapidfuzz/RapidFuzz
        spdx_license: MIT
        pin: 3.14.5
    selected: RapidFuzz
    decision_reason: Reuses maintained optimized string scoring.
    wrapper_boundary: quality/text.py defines only project thresholds and token normalization.
    lock_reference: uv.lock (rapidfuzz==3.14.5)

  - module_id: sqlmodel
    introduced_in_batch: 2
    need: Combined Pydantic and ORM candidate
    disposition: custom
    candidates:
      - repository: https://github.com/fastapi/sqlmodel
        spdx_license: MIT
        pin: 0.0.38
    selected: null
    decision_reason: Frozen public Pydantic models and SQLite rows have incompatible lifecycle and migration requirements.
    wrapper_boundary: none
    lock_reference: null
    rejected_reasons:
      - Durable migrations still require Alembic.
      - Coupling public request contracts to mutable rows would weaken immutable snapshots.

  - module_id: diskcache
    introduced_in_batch: 2
    need: Local cache candidate
    disposition: custom
    candidates:
      - repository: https://github.com/grantjenks/python-diskcache
        spdx_license: Apache-2.0
        pin: 5.6.3
    selected: null
    decision_reason: A separate cache database cannot atomically participate in current-pointer and parent-reference protection.
    wrapper_boundary: none
    lock_reference: null
    rejected_reasons:
      - Version/cache protection must share the Batch 2 SQLite transaction graph.
      - Existing project cache payload semantics require durable artifact version provenance.

  - module_id: model_profile_registry
    introduced_in_batch: 2
    need: Immutable local model-pair import, profile identity and active-selection invariants
    disposition: custom
    candidates: []
    selected: null
    decision_reason: This is project-specific glue over filesystem, SQLite and official GPT-SoVITS endpoints; standard library copying/hashing is sufficient.
    wrapper_boundary: storage/model_importer.py + storage/model_profile_store.py + core/model_profile_service.py
    lock_reference: null
    rejected_reasons:
      - No existing library supplies the required pair-level publication, SHA snapshot and no-fallback semantics.

  - module_id: openai_compatible_director
    introduced_in_batch: 3
    need: OpenAI-compatible chat completions JSON director and bounded reference-text corrections
    disposition: thin_wrapper
    candidates:
      - repository: https://github.com/encode/httpx
        spdx_license: BSD-3-Clause
        pin: ">=0.28,<1"
      - repository: https://github.com/openai/openai-python
        spdx_license: Apache-2.0
        pin: ">=1"
    selected: HTTPX + src/voice_pipeline/modules/llm/client.py
    decision_reason: HTTPX 已被项目锁定并完整覆盖 /chat/completions、timeout、重试和 OpenAI 兼容 base_url；避免引入第二个 SDK 和凭据配置面。
    wrapper_boundary: client.py 只做 JSON wire contract、有限重试和无密钥错误映射；director.py 只做项目特有的 source 区间/情绪向量校验。
    lock_reference: pyproject.toml dependencies + uv.lock
    rejected_reasons:
      - openai-python 对本地 OpenAI 兼容服务不提供项目所需的 source-range schema 和凭据不落盘边界。

  - module_id: chapter_audio_composer
    introduced_in_batch: 3
    need: 将明确选中的 GSV 版本、段后停顿和时间线拼接为 WAV
    disposition: thin_wrapper
    candidates:
      - repository: https://github.com/bastibe/python-soundfile
        spdx_license: BSD-3-Clause
        pin: ">=0.13,<1"
      - repository: https://github.com/numpy/numpy
        spdx_license: BSD-3-Clause
        pin: ">=2.1,<3"
    selected: SoundFile + NumPy + src/voice_pipeline/modules/audio/composer.py
    decision_reason: 复用维护活跃的解码、编码和数组运算；项目层仅定义 selected-version、pause 和原子 timeline 语义。
    wrapper_boundary: composer.py 不实现音频 codec，只组织 ready artifact WAV、声道归一和静音数组后调用依赖库。
    lock_reference: pyproject.toml dependencies + uv.lock

  - module_id: starlette_static_sse
    introduced_in_batch: 4
    need: Local-only packaged static workbench assets and server-sent progress events
    disposition: reuse
    candidates:
      - repository: https://github.com/encode/starlette
        spdx_license: BSD-3-Clause
        pin: ">=0.40,<1"
    selected: FastAPI bundled Starlette FileResponse + StreamingResponse
    decision_reason: Reuses the installed ASGI response primitives instead of writing a custom HTTP file server or event transport.
    wrapper_boundary: workbench_routes.py only allow-lists packaged files and serializes path-free chapter DTOs.
    lock_reference: pyproject.toml fastapi dependency + uv.lock (starlette)

  - module_id: native_browser_workbench
    introduced_in_batch: 4
    need: Local master-detail editor, audio controls and SSE consumer without a separate frontend runtime
    disposition: reuse
    candidates:
      - repository: https://github.com/whatwg/html
        spdx_license: CC-BY-4.0
        pin: living-standard
      - repository: https://github.com/whatwg/dom
        spdx_license: CC-BY-4.0
        pin: living-standard
    selected: Native HTML, CSS and ES modules provided by the local browser
    decision_reason: No Node build chain, CDN, telemetry or client credential surface is required for a loopback-only workbench.
    wrapper_boundary: webui/app.js only calls the versioned control-plane HTTP API; it never contacts model workers.
    lock_reference: packaged src/voice_pipeline/webui assets

  - module_id: react_vue_frontend_framework
    introduced_in_batch: 4
    need: Candidate component framework for the local workbench
    disposition: custom
    candidates:
      - repository: https://github.com/facebook/react
        spdx_license: MIT
        pin: 19.1.1
      - repository: https://github.com/vuejs/core
        spdx_license: MIT
        pin: 3.5.21
    selected: null
    decision_reason: Rejected because a local single-user page does not need a Node build, runtime framework or dependency update surface.
    wrapper_boundary: none
    lock_reference: null
    rejected_reasons:
      - Native browser APIs provide the required fixed-list, form and audio-control behavior.
      - React/Vue would add a frontend package manager without improving the control-plane contract.
