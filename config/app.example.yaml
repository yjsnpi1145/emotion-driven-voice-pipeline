schema_version: 1
mode: real
engine_lifecycle: exclusive_process
server:
  host: 127.0.0.1
  port: 8765
runtime_dir: ../runtime
engine_lock_path: engines.lock.yaml
checkpoint_lock_path: checkpoints.lock.yaml
queue:
  max_concurrency: 1
  queue_timeout_seconds: 60
llm:
  mode: openai
  base_url: https://api.openai.com/v1
  model: gpt-4.1-mini
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 60
  max_retries: 2
  max_reference_corrections: 2
quality:
  mode: faster_whisper
  model_path: ../runtime/models/faster-whisper-small
  model_lock_path: quality-model.lock.yaml
  policy:
    schema_version: 1
    min_total_seconds: 3.0
    max_total_seconds: 10.0
    min_speech_seconds: 1.5
    min_speech_ratio: 0.35
    min_similarity: 0.60
    short_text_max_normalized_length: 3
    short_text_min_similarity: 0.75
    normalizer_version: 2
storage:
  database_path: state/pipeline.sqlite3
  artifact_root: artifacts
  control_lock_path: state/control.lock
  busy_timeout_ms: 5000
  wal_autocheckpoint_pages: 1000
  history_limit: 5
  cache_max_entries_per_kind: 500
  cache_max_age_days: 90
model_library:
  models_root: ../models/gpt-sovits
  allowed_import_roots:
    - ../external/GPT-SoVITS
engines:
  indextts:
    base_url: http://127.0.0.1:9871
    python_executable: ../external/index-tts/.venv/Scripts/python.exe
    repo_dir: ../external/index-tts
    request_timeout_seconds: 300
  gpt_sovits:
    base_url: http://127.0.0.1:9880
    python_executable: ../external/GPT-SoVITS/.conda/python.exe
    repo_dir: ../external/GPT-SoVITS
    request_timeout_seconds: 300

