<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>情绪配音工作台</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="title-block">
        <p class="eyebrow">本地跨语言 TTS</p>
        <h1>情绪配音工作台</h1>
        <p id="chapter-title" class="chapter-title">选择或创建一个章节任务</p>
        <p id="run-status" aria-live="polite">草稿编辑不会触发推理</p>
      </div>
      <section id="chapter-summary" class="chapter-summary" aria-label="章节状态摘要" aria-live="polite"></section>
      <div class="chapter-actions">
        <div id="chapter-audio" aria-label="当前整篇成品"></div>
        <button id="compose-chapter" type="button" disabled>重新拼接整篇</button>
      </div>
    </header>

    <main class="workbench">
      <section class="chapter-panel" aria-label="章节任务">
        <details class="model-panel" open>
          <summary>GPT-SoVITS 模型档案</summary>
          <p class="help">导入后必须显式设为当前模型；已入队作业不会被切换影响。</p>
          <form id="model-profile-form">
            <label>档案名称 <input name="display_name" required /></label>
            <label>GPT 权重（.ckpt） <input name="gpt_source_path" required /></label>
            <label>SoVITS 权重（.pth） <input name="sovits_source_path" required /></label>
            <label>模型家族（可选） <input name="declared_family" /></label>
            <button type="submit">导入本地模型库</button>
          </form>
          <div id="model-profile-list" class="model-profile-list" aria-live="polite"></div>
        </details>

        <form id="chapter-form" class="chapter-form">
          <h2>创建整篇任务</h2>
          <label>标题 <input name="title" required value="新章节" /></label>
          <label>原文 <textarea name="source_text" required rows="7" placeholder="粘贴需要配音的原文"></textarea></label>
          <label>参考音色路径 <input name="base_voice_path" required placeholder="D:\\voices\\speaker.wav" /></label>
          <label>目标语言
            <select name="target_language"><option value="ja">日语</option><option value="en">英语</option><option value="zh">中文</option></select>
          </label>
          <label>模型配置 <select name="model_profile_id" id="model-profile" required></select></label>
          <button type="submit">创建整篇任务</button>
        </form>
        <nav id="chapter-list" aria-label="章节历史"></nav>
      </section>

      <section class="segment-panel" aria-label="分块列表">
        <div class="panel-heading">
          <div><p class="eyebrow">分块</p><h2>章节分块</h2></div>
          <span id="segment-count" class="status">0 个</span>
        </div>
        <div class="segment-filters">
          <label>搜索 <input id="segment-search" placeholder="搜索原文" /></label>
          <label>状态
            <select id="segment-state-filter">
              <option value="all">全部状态</option>
              <option value="ready">完成</option>
              <option value="generating">生成中</option>
              <option value="waiting">等待生成</option>
              <option value="draft_pending">参考参数未应用</option>
              <option value="stale">GSV 过期</option>
              <option value="failed">失败</option>
            </select>
          </label>
        </div>
        <div id="segment-scroll" tabindex="0" aria-label="分块虚拟列表">
          <div id="segment-list" aria-label="分块列表"></div>
        </div>
      </section>

      <section id="segment-editor" class="editor" aria-label="分块编辑器">
        <p>从左侧选择分块以编辑草稿。保存不会触发推理。</p>
      </section>
    </main>
    <template id="segment-row-template"><button class="segment-row" type="button"></button></template>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
