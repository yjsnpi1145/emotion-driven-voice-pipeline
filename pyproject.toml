[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "emotion-driven-voice-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.2,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "soundfile>=0.13,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-psutil>=6.1,<8",
]

[project.scripts]
voice-pipeline = "voice_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
  "gpu: requires real CUDA models and checkpoints",
  "gpu_residency: runs the isolated resident-versus-exclusive GPU lifecycle probe",
  "process: starts local subprocesses",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/voice_pipeline", "workers"]

[[tool.mypy.overrides]]
module = ["indextts", "indextts.*", "torch", "torch.*", "soundfile"]
ignore_missing_imports = true
