[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "emotion-driven-voice-pipeline"
version = "0.1.0"
description = "Local emotion-directed cross-language dubbing workbench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "MODEL_LICENSES.md"]
requires-python = ">=3.11,<3.12"
keywords = ["text-to-speech", "dubbing", "gpt-sovits", "indextts2", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Framework :: FastAPI",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "aiosqlite>=0.22,<0.23",
  "alembic>=1.18.5,<2",
  "faster-whisper>=1.2,<2",
  "fastapi>=0.115.2,<1",
  "huggingface-hub>=1.4,<2",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "opencc>=1.4.1,<1.5",
  "portalocker>=4,<5",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "RapidFuzz>=3.14,<4",
  "silero-vad>=6,<7",
  "soundfile>=0.13,<1",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
  "types-psutil>=6.1,<8",
]

[project.scripts]
voice-pipeline = "voice_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]
include = ["src/voice_pipeline/webui/**"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "crash_recovery: kills and restarts the local control process",
  "gpu: requires real CUDA models and checkpoints",
  "gpu_residency: runs the isolated resident-versus-exclusive GPU lifecycle probe",
  "process: starts local subprocesses",
  "integration_cpu: exercises the full control plane over loopback without real models",
  "quality_model: requires the pinned local faster-whisper model asset",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/voice_pipeline/cli.py" = ["B008", "B904"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/voice_pipeline", "workers"]

[[tool.mypy.overrides]]
module = ["indextts", "indextts.*", "torch", "torch.*", "soundfile"]
ignore_missing_imports = true
